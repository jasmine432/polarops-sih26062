<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Integrated Polar Expedition Logistics and Asset Management System for Antarctic and Arctic Operations (NCPOR / MoES)" />
    <title>PolarOps — Expedition Operations Platform | NCPOR</title>
    <script>
      (function() {
        try {
          var theme = localStorage.getItem('polarops-theme');
          if (theme === 'dark') {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-[#F4FAFD] dark:bg-[#071A2F] text-[#001B48] dark:text-[#F4FAFD] min-h-screen antialiased transition-colors duration-200">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
